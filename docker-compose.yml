services:
  # ============================================================================
  # Relational Database & Vector Store (PostgreSQL 16 + pgvector)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docunorm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docunorm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docunorm_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-docunorm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docunorm_admin} -d ${POSTGRES_DB:-docunorm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docunorm-network

  # ============================================================================
  # In-Memory Cache & Asynchronous Task Broker (Redis 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: docunorm-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - docunorm-network

volumes:
  postgres_data:
    name: docunorm_postgres_data
  redis_data:
    name: docunorm_redis_data

networks:
  docunorm-network:
    name: docunorm-network
    driver: bridge
